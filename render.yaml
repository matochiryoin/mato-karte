# Renderの「Blueprint」機能で、このファイルを読んで自動的にサーバーと保存領域を用意してもらう設定。
# 手順はプロジェクトのREADME.mdを参照。
services:
  - type: web
    name: mato-karte
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: KARTE_SECRET_KEY
        generateValue: true
      - key: KARTE_PASSWORD
        sync: false
      - key: KARTE_DATA_DIR
        value: /var/data
    disk:
      name: karte-data
      mountPath: /var/data
      sizeGB: 1
