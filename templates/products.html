{% extends "base.html" %}
{% block content %}
<a class="back-link" href="{{ url_for('sales_ledger') }}">← 売上台帳に戻る</a>
<div class="card">
  <h2>商品・メニュー</h2>
  <p style="font-size:13px;color:var(--text-mute);margin-top:0;">予約入力のメニューとお会計の商品名・単価はここから選ばれます。内税は税込価格、外税は税抜価格で、外税は会計時に10%が加算されます。</p>
  {% for p in items %}
  <form method="post" action="{{ url_for('product_update', product_id=p.id) }}" class="prod-row" style="{{ 'opacity:.5;' if not p.active }}">
    <div class="prod-name"><b>{{ p.name }}</b></div>
    <div class="prod-edit">
      <select name="category">{% for c in categories %}<option {% if c == p.category %}selected{% endif %}>{{ c }}</option>{% endfor %}</select>
      <select name="tax_type">{% for x in tax_types %}<option {% if x == p.tax_type %}selected{% endif %}>{{ x }}</option>{% endfor %}</select>
      <input type="number" name="price" value="{{ p.price }}" min="0">
      <label class="use"><input type="checkbox" name="active" value="1" {% if p.active %}checked{% endif %}>使う</label>
      <button class="btn secondary" type="submit">保存</button>
    </div>
  </form>
  {% endfor %}
</div>
<div class="card">
  <h2>商品を追加</h2>
  <form method="post">
    <label>商品名</label><input type="text" name="name" required>
    <div class="field-row">
      <div><label>区分</label><select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></div>
      <div><label>税区分</label><select name="tax_type">{% for x in tax_types %}<option>{{ x }}</option>{% endfor %}</select></div>
      <div><label>単価（内税は税込・外税は税抜）</label><input type="number" name="price" min="0" value="0"></div>
    </div>
    <div class="btn-row"><button class="btn" type="submit">追加</button></div>
  </form>
</div>
{% endblock %}
